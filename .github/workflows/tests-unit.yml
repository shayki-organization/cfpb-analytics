name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    - cron: "0 0 * * *"
jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies with Yarn
        run: yarn install

      - name: Run unit tests
        run: yarn jest
